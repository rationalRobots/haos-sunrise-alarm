name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # NOTE: The HACS publish-validation job (hacs/action) was removed. It only works
  # on PUBLIC repos: its integration_manifest/hacsjson checks fetch files from
  # raw.githubusercontent.com, which returns nothing for a private repo, so the job
  # can never pass here (and integration_manifest is not ignorable). This repo is
  # private and installed as a HACS *custom* repository, which does not require
  # passing hacs/action. hassfest below still validates the manifest. If this repo
  # is ever made public to publish via the HACS default store, restore the job and
  # add a description, topics, and brand assets.

  python:
    name: Byte-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall custom_components/sunrise_alarm
